apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runedrive-api
  namespace: runedrive
  labels:
    app: runedrive-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - host: runedrive.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: runedrive-api
                port:
                  number: 80
