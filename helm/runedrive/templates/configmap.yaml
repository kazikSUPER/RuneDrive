apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runedrive.fullname" . }}-config
  labels:
    {{- include "runedrive.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Хости сервісів даних виводяться з імені релізу, щоб чарт працював з будь-яким release name
  POSTGRES_SERVER: {{ include "runedrive.fullname" . }}-postgres
  REDIS_HOST: {{ include "runedrive.fullname" . }}-redis
