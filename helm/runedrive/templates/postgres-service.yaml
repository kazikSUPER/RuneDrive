apiVersion: v1
kind: Service
metadata:
  name: {{ include "runedrive.fullname" . }}-postgres
  labels:
    {{- include "runedrive.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
