apiVersion: v1
kind: Pod
metadata:
  name: {{ include "runedrive.fullname" . }}-test-connection
  labels:
    {{- include "runedrive.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl
      command: ["curl", "-fsS", "http://{{ include "runedrive.fullname" . }}-api/api/v1/health"]
