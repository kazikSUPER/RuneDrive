apiVersion: v1
kind: Pod
metadata:
  name: {{ include "runedrive.fullname" . }}-test-connection
  labels:
    {{- include "runedrive.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl
      command: ["sh", "-ec", 'for i in $(seq 1 30); do curl -fsS http://{{ include "runedrive.fullname" . }}-api/api/v1/health && exit 0; sleep 2; done; exit 1']
