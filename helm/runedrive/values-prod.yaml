# Профіль production: більше реплік, вищі ліміти, свіжий реліз, Ingress увімкнений
replicaCount: 3

config:
  ENVIRONMENT: "k8s-production"
  APP_ENV: "k8s-production"
  DEBUG: "false"

image:
  tag: "1.1.0"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

ingress:
  enabled: true
