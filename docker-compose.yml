name: runedrive_lab2

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: runedrive_lab2_api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-runedrive_lab2}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-rune_super_secret_cyber_jwt_key_2026_lab2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - runedrive_lab2_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: runedrive_lab2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-runedrive_lab2}
    ports:
      - "5433:5432"
    volumes:
      - postgres_lab2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d runedrive_lab2"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - runedrive_lab2_network

  redis:
    image: redis:7-alpine
    container_name: runedrive_lab2_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_lab2_data:/data
    networks:
      - runedrive_lab2_network

volumes:
  postgres_lab2_data:
  redis_lab2_data:

networks:
  runedrive_lab2_network:
    driver: bridge
