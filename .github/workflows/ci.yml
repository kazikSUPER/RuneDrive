name: RuneDrive CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. СТАТИЧНИЙ АНАЛІЗ КОДУ (LINTING & SAST)
  # =========================================================================
  lint:
    name: Code Quality & Linting (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.6.0

      - name: Run Ruff static analysis (Fail Fast)
        run: |
          ruff check .

      - name: Run Ruff format check
        run: |
          ruff format --check .

  # =========================================================================
  # 2. ЗБІРКА ТА ТЕСТУВАННЯ (BUILD & TEST)
  # =========================================================================
  test:
    name: Unit & Integration Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with Pytest
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_health.py tests/test_root.py -v

  # =========================================================================
  # 3. ЗБІРКА КОНТЕЙНЕРА ТА СЕК'ЮРІТІ АУДИТ (DOCKER BUILD & TRIVY SCAN)
  # =========================================================================
  docker-build-scan:
    name: Docker Build & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: runedrive-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'runedrive-api:ci-test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # 4. ПУБЛІКАЦІЯ ОБРАЗУ В РЕЄСТРІ (GHCR.IO)
  # Тільки для push у робочі гілки (не для Pull Request)
  # =========================================================================
  docker-publish:
    name: Publish Container Image to GHCR
    runs-on: ubuntu-latest
    needs: [docker-build-scan]
    if: github.event_name == 'push'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
