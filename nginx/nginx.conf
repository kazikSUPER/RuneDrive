events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream runedrive_cluster {
        server api:8000 max_fails=1 fail_timeout=3s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://runedrive_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 300ms;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 5;
            proxy_next_upstream_timeout 5s;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_header X-Instance-ID;
        }
    }
}
