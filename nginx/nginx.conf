events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # --------------------------------------------------------------------------
    # Пул бекенд-інстансів (Upstream Pool) для горизонтального масштабування
    # --------------------------------------------------------------------------
    upstream runedrive_cluster {
        # 1. Алгоритм за замовчуванням: Round Robin (почерговий розподіл запитів)
        
        # 2. Для перемикання на Least Connections (розподіл за активними конектами):
        # least_conn;

        # 3. Для перемикання на IP Hash (сесійна прив'язка за IP клієнта):
        # ip_hash;

        # Два ізольованих інстанси бекенду зі спільним сховищем
        server api-1:8000 max_fails=3 fail_timeout=10s;
        server api-2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Головна точка входу для клієнтів (Reverse Proxy / Load Balancer)
        location / {
            proxy_pass http://runedrive_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Механізм відмовостійкості (Failover & Resilience):
            # Якщо інстанс повертає помилку 5xx або таймаут, Nginx непомітно
            # для клієнта перенаправляє запит на інший працездатний інстанс
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            # Прокидання сервісного заголовка X-Instance-ID клієнту
            proxy_pass_header X-Instance-ID;
        }
    }
}
